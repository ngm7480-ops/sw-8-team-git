spring.application.name=team-eight-backend
server.port=8080
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.enabled=true
spring.servlet.encoding.force=true

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/team8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:team8}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:team8_local_password}
spring.datasource.hikari.connection-timeout=5000

neis.endpoint=${API_ENDPOINT:https://open.neis.go.kr/hub/mealServiceDietInfo}
neis.api-key=${API_KEY:}
neis.office-code=${NEIS_OFFICE_CODE:R10}
neis.school-code=${NEIS_SCHOOL_CODE:8750829}
spring.http.clients.connect-timeout=${API_CONNECT_TIMEOUT:3s}
spring.http.clients.read-timeout=${API_READ_TIMEOUT:10s}
