services:
  backend:
    # backend/Dockerfile을 사용해 Spring Boot Image를 만든다.
    build:
      context: ./backend

    # Host의 8080번 Port를 Container의 8080번 Port에 연결한다.
    ports:
      - "8080:8080"

    environment:
      # Docker Network 안에서는 MySQL Container의 service 이름(mysql)으로 접근한다.
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}

    # MySQL이 실제 요청을 받을 준비가 된 뒤 Backend를 시작한다.
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    # Docker Hub의 MySQL 공식 Image를 사용한다.
    image: mysql:8.4

    environment:
      # 값은 team-8/.env에서 읽는다.
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    ports:
      - "3306:3306"

    # Container를 다시 만들어도 Database 데이터를 유지한다.
    volumes:
      - mysql-data:/var/lib/mysql

    # MySQL이 실제 연결을 받을 준비가 되었는지 확인한다.
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  mysql-data:
