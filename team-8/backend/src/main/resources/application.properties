# Spring Boot Backend가 사용할 Port
server.port=8080

# Docker Compose에서는 아래 환경변수가 주입된다.
# 환경변수가 없으면 localhost의 practice Database를 기본값으로 사용한다.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/practice}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:practice}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:practice}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

neis.endpoint=${API_ENDPOINT:https://open.neis.go.kr/hub/mealServiceDietInfo}
neis.api-key=${API_KEY:}
neis.office-code=${NEIS_OFFICE_CODE:R10}
neis.school-code=${NEIS_SCHOOL_CODE:8750829}
neis.school-name=${NEIS_SCHOOL_NAME:\uacbd\ubd81\uc18c\ud504\ud2b8\uc6e8\uc5b4\ub9c8\uc774\uc2a4\ud130\uace0\ub4f1\ud559\uad50}
spring.http.clients.connect-timeout=${API_CONNECT_TIMEOUT:3s}
spring.http.clients.read-timeout=${API_READ_TIMEOUT:10s}
